[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-diffusion-optimizer"
version = "0.1.0"
description = "CPU-first engine for analyzing, profiling, and optimizing diffusion-model inference"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "CPU Diffusion Optimizer Contributors" },
]
keywords = [
  "diffusion",
  "cpu",
  "inference",
  "optimization",
  "caching",
  "quantization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  # Prefer CPU wheels: pip install torch --index-url https://download.pytorch.org/whl/cpu
  "torch>=2.1",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "mypy>=1.8",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
diffusers = [
  "diffusers>=0.27",
  "transformers>=4.38",
  "accelerate>=0.27",
]
all = [
  "cpu-diffusion-optimizer[dev,api,diffusers]",
]

[project.scripts]
cdo = "cli.main:app"
cpu-diffusion-optimizer = "cli.main:app"

[project.urls]
Homepage = "https://github.com/example/cpu-diffusion-optimizer"
Documentation = "https://github.com/example/cpu-diffusion-optimizer/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "cli*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
